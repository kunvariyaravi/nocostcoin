version: '3.8'

# Local 3-node devnet.
#
#   docker compose up -d --build
#
# Each node uses its own config (so it gets its own validator seed) and its own
# data directory. --data-dir points the node at the mounted volume - without it
# the chain database would be written inside the container and lost on every
# recreate.

services:
  node-1:
    build: ./core
    ports:
      - "9000:9000"
      - "8000:8000"
    volumes:
      - ./data/node-1:/data
      - ./config:/usr/local/bin/config
    command: [ "--config", "config/node1.toml", "--data-dir", "/data" ]
    environment:
      - RUST_LOG=info
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  node-2:
    build: ./core
    ports:
      - "9001:9001"
      - "8001:8001"
    volumes:
      - ./data/node-2:/data
      - ./config:/usr/local/bin/config
    command: [ "--config", "config/node2.toml", "--data-dir", "/data", "--bootstrap", "/ip4/127.0.0.1/tcp/9000" ]
    environment:
      - RUST_LOG=info
    restart: unless-stopped
    depends_on:
      - node-1

  node-3:
    build: ./core
    ports:
      - "9002:9002"
      - "8002:8002"
    volumes:
      - ./data/node-3:/data
      - ./config:/usr/local/bin/config
    command: [ "--config", "config/node3.toml", "--data-dir", "/data", "--bootstrap", "/ip4/127.0.0.1/tcp/9000" ]
    environment:
      - RUST_LOG=info
    restart: unless-stopped
    depends_on:
      - node-1
