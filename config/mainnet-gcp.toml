# Nocostcoin MAINNET - GCP validator node (Ubuntu VM + Docker)
#
# Data layout inside the container:
#   /data/validator_9000.key   consensus key  (generated here, never leaves)
#   /data/wallet_9000.key     wallet key     (generated here, never leaves)
#   /data/libp2p_identity.key libp2p seed    (keeps the PeerId stable)
#   /data/nocostcoin_db_9000  RocksDB
#
# Run the ceremony on THIS machine before starting the chain:
#   docker compose -f docker-compose.gcp-validator.yml run --rm node-1 --identity
# and paste the printed VALIDATOR_PUBKEY / WALLET_ADDRESS into config/genesis.toml
# (and identically into every other node's genesis) before the real start.

data_dir = "/data"

[network]
port = 9000
bootstrap_peers = []
listen_addr = "/ip4/0.0.0.0/tcp/9000"

# >>> CANONICAL MAINNET GENESIS - frozen at launch <<<
#
# 1. Run the ceremony ON EACH VALIDATOR'S OWN MACHINE:
#       nocostcoin --identity --config config/mainnet-gcp.toml
#    It creates the validator key locally and prints:
#       VALIDATOR_PUBKEY=<64 hex>   (consensus key - goes in initial_validators)
#       WALLET_ADDRESS=<64 hex>     (wallet key  - goes in reward_address)
#    The secret keys stay on that machine. Never copy them anywhere.
# 2. Collect the validator pubkeys + wallet addresses and paste them below.
# 3. Copy this [genesis] block IDENTICALLY into mainnet.toml, mainnet2.toml,
#    mainnet3.toml and mainnet-gcp.toml. One byte of difference = permanent fork.
# 4. NEVER edit after launch.
#
# initial_validators holds PUBLIC keys only, so this file is safe to commit.
# The node refuses to start while the placeholders are in place.
#
# Tokenomics:
#   - 10,000,000 NCC faucet float, paid out 100 NCC per address, once ever.
#   - 1,296,000 NCC reward pool, refilled with the same amount every 720
#     epochs (30 days) and paid out 1 NCC per block produced.

[genesis]
chain_id = 1
genesis_time = 1793191258295
genesis_seed = "022323152b4b44d56f0d1e22f2cea0f5faa01a980feeafa7275e4ab51a2995e7"
initial_validators = [
    { consensus_pubkey = "128587edd4d3903363c5b837e877dfdf12732f50d7acc2970dacdcae22048c2c", reward_address = "dd5b099c02335b7e4f3d6f5e36ea85f9d02117318d52ce7e1fa3cb54dfc2ebeb" },
]
initial_funded_accounts = [
    { address = "dd5b099c02335b7e4f3d6f5e36ea85f9d02117318d52ce7e1fa3cb54dfc2ebeb", amount = 10000000 },
]

[mining]
enabled = true
# NO validator_seed on mainnet - the seed IS the validator's secret key and the
# node refuses to start with one.
