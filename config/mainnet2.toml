# Nocostcoin MAINNET - Node 2 (connects to Node 1)
# PUBLIC-LAUNCH VARIANT: set bootstrap to Node 1 public multiaddr with PeerId:
#   "/ip4/<NODE1_PUBLIC_IP>/tcp/9000/p2p/<NODE1_PEER_ID>"
# API stays localhost-only.
data_dir = "C:/nocostcoin/data/mainnet2"

[network]
port = 9001
bootstrap_peers = ["/ip4/127.0.0.1/tcp/9000"]
listen_addr = "/ip4/0.0.0.0/tcp/9001"

# >>> CANONICAL GENESIS - must be byte-identical on all nodes <<<
[genesis]
chain_id = 1
genesis_time = 1793120271511
genesis_seed = "3798dd950fe5753bf705c540701345e4b8910f09f34f73878e00751bb7a5da9e"
initial_validators = [
    "128587edd4d3903363c5b837e877dfdf12732f50d7acc2970dacdcae22048c2c",
]
initial_funded_accounts = [
    "dd5b099c02335b7e4f3d6f5e36ea85f9d02117318d52ce7e1fa3cb54dfc2ebeb",
]

[mining]
enabled = true
# NO validator_seed on mainnet - the seed IS the validator's secret key and the
# node refuses to start with one. The key lives in <data_dir>/validator_9001.key.
