# Nginx for the Nocostcoin node API on GCP.
#
# The website (nocostcoin.com) is served by Vercel; this VM only serves the
# node's HTTP API at api.nocostcoin.com. The node listens on 127.0.0.1:8000
# (see docker-compose.gcp-validator.yml), so nginx is the only way in.
#
# The Vercel UI calls the node server-side with INTERNAL_API_URL set to
# https://api.nocostcoin.com, e.g. ${INTERNAL_API_URL}/stats.
#
# The node's own token (NOCOSTCOIN_API_TOKEN) protects the endpoints that act
# as the node - transaction/create, validator/register, wallet/new and
# wallet/recover. Reads, /faucet and /transaction/send are open, which is what
# a public node needs.
#
# Replace YOUR_DOMAIN with your domain.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/nocostcoin_proxy.conf;
    }
}
