# Nginx for Nocostcoin on GCP (SEED deployment). Replace YOUR_DOMAIN with your domain.
#
# The node's API listens on 127.0.0.1:8000 and the UI on 127.0.0.1:3000 - both are
# loopback-only, so this proxy is the only public entry point.
#
#   /api/node/<x>  ->  http://127.0.0.1:8000/<x>   (node API)
#   /               ->  http://127.0.0.1:3000       (UI)
#
# The seed runs a throwaway test chain, so the faucet is exposed on purpose.
# The wallet-spending endpoints are still not proxied.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # --- Node API -----------------------------------------------------------
    location = /api/node/stats        { rewrite ^/api/node/(.*)$ /$1 break; proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/nocostcoin_proxy.conf; }
    location = /api/node/health       { rewrite ^/api/node/(.*)$ /$1 break; proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/nocostcoin_proxy.conf; }
    location = /api/node/blocks       { rewrite ^/api/node/(.*)$ /$1 break; proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/nocostcoin_proxy.conf; }
    location = /api/node/block/latest { rewrite ^/api/node/(.*)$ /$1 break; proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/nocostcoin_proxy.conf; }
    location = /api/node/mempool      { rewrite ^/api/node/(.*)$ /$1 break; proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/nocostcoin_proxy.conf; }
    location = /api/node/peers        { rewrite ^/api/node/(.*)$ /$1 break; proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/nocostcoin_proxy.conf; }
    location = /api/node/validator    { rewrite ^/api/node/(.*)$ /$1 break; proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/nocostcoin_proxy.conf; }
    location = /api/node/validators   { rewrite ^/api/node/(.*)$ /$1 break; proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/nocostcoin_proxy.conf; }
    location = /api/node/consensus    { rewrite ^/api/node/(.*)$ /$1 break; proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/nocostcoin_proxy.conf; }
    location = /api/node/faucet       { rewrite ^/api/node/(.*)$ /$1 break; proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/nocostcoin_proxy.conf; }

    location ~ ^/api/node/block/[0-9a-fA-F]+$           { rewrite ^/api/node/(.*)$ /$1 break; proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/nocostcoin_proxy.conf; }
    location ~ ^/api/node/account/[0-9a-fA-F]+$         { rewrite ^/api/node/(.*)$ /$1 break; proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/nocostcoin_proxy.conf; }
    location ~ ^/api/node/account/[0-9a-fA-F]+/history$ { rewrite ^/api/node/(.*)$ /$1 break; proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/nocostcoin_proxy.conf; }
    location ~ ^/api/node/transaction/[0-9a-fA-F]+$     { rewrite ^/api/node/(.*)$ /$1 break; proxy_pass http://127.0.0.1:8000; include /etc/nginx/snippets/nocostcoin_proxy.conf; }

    # The wallet-spending endpoints are not exposed.
    location /api/node/ {
        return 403;
    }

    # --- UI -----------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
